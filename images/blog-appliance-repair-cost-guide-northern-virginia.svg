<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <rect width="800" height="400" fill="#f0f4f1"/>
  <!-- Price chart bars -->
  <rect x="150" y="280" width="60" height="80" rx="3" fill="#1a5632" opacity="0.6"/>
  <rect x="230" y="220" width="60" height="140" rx="3" fill="#1a5632" opacity="0.5"/>
  <rect x="310" y="200" width="60" height="160" rx="3" fill="#1a5632" opacity="0.7"/>
  <rect x="390" y="240" width="60" height="120" rx="3" fill="#e8491d" opacity="0.6"/>
  <rect x="470" y="260" width="60" height="100" rx="3" fill="#1a5632" opacity="0.5"/>
  <rect x="550" y="180" width="60" height="180" rx="3" fill="#1a5632" opacity="0.6"/>
  <!-- Base line -->
  <line x1="130" y1="360" x2="630" y2="360" stroke="#1a5632" stroke-width="2"/>
  <!-- Dollar signs -->
  <text x="170" y="270" font-family="Inter,sans-serif" font-size="16" fill="white" text-anchor="middle" font-weight="600">$</text>
  <text x="250" y="210" font-family="Inter,sans-serif" font-size="16" fill="white" text-anchor="middle" font-weight="600">$$</text>
  <text x="340" y="190" font-family="Inter,sans-serif" font-size="16" fill="white" text-anchor="middle" font-weight="600">$$</text>
  <text x="420" y="230" font-family="Inter,sans-serif" font-size="16" fill="white" text-anchor="middle" font-weight="600">$</text>
  <text x="500" y="250" font-family="Inter,sans-serif" font-size="16" fill="white" text-anchor="middle" font-weight="600">$</text>
  <text x="580" y="170" font-family="Inter,sans-serif" font-size="16" fill="white" text-anchor="middle" font-weight="600">$$$</text>
  <!-- Labels -->
  <text x="180" y="380" font-family="Inter,sans-serif" font-size="10" fill="#1a5632" text-anchor="middle">Washer</text>
  <text x="260" y="380" font-family="Inter,sans-serif" font-size="10" fill="#1a5632" text-anchor="middle">Dryer</text>
  <text x="340" y="380" font-family="Inter,sans-serif" font-size="10" fill="#1a5632" text-anchor="middle">Fridge</text>
  <text x="420" y="380" font-family="Inter,sans-serif" font-size="10" fill="#e8491d" text-anchor="middle">Oven</text>
  <text x="500" y="380" font-family="Inter,sans-serif" font-size="10" fill="#1a5632" text-anchor="middle">DW</text>
  <text x="580" y="380" font-family="Inter,sans-serif" font-size="10" fill="#1a5632" text-anchor="middle">HVAC</text>
</svg>