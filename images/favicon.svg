<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a5632"/>
      <stop offset="100%" style="stop-color:#2a7a4a"/>
    </linearGradient>
    <linearGradient id="ac" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#e8491d"/>
      <stop offset="100%" style="stop-color:#ff6b3d"/>
    </linearGradient>
  </defs>
  <!-- Rounded Square Background -->
  <rect x="2" y="2" width="60" height="60" rx="14" ry="14" fill="url(#bg)"/>
  <!-- Inner shadow border -->
  <rect x="4" y="4" width="56" height="56" rx="12" ry="12" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
  <!-- Bold "A" Letter -->
  <text x="32" y="44" font-family="'Poppins','Arial Black',sans-serif" font-size="36" font-weight="900" fill="white" text-anchor="middle" letter-spacing="-1">A</text>
  <!-- Wrench accent crossing the A -->
  <g transform="translate(38, 12) rotate(30)">
    <rect x="0" y="0" width="4" height="20" rx="2" fill="url(#ac)"/>
    <circle cx="2" cy="0" r="4" fill="none" stroke="url(#ac)" stroke-width="2.2"/>
  </g>
  <!-- Bottom accent bar -->
  <rect x="14" y="50" width="36" height="3.5" rx="1.75" fill="url(#ac)"/>
</svg>