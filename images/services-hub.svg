<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300">
  <rect width="800" height="300" fill="#f0f4f1"/>
  <!-- Grid of appliance outlines -->
  <rect x="120" y="40" width="80" height="110" rx="4" fill="none" stroke="#1a5632" stroke-width="2" opacity="0.4"/>
  <line x1="120" y1="80" x2="200" y2="80" stroke="#1a5632" stroke-width="1.5" opacity="0.4"/>
  <rect x="220" y="50" width="80" height="100" rx="4" fill="none" stroke="#1a5632" stroke-width="2" opacity="0.4"/>
  <circle cx="260" cy="110" r="25" fill="none" stroke="#1a5632" stroke-width="1.5" opacity="0.4"/>
  <rect x="320" y="50" width="80" height="100" rx="4" fill="none" stroke="#1a5632" stroke-width="2" opacity="0.4"/>
  <circle cx="360" cy="110" r="25" fill="none" stroke="#1a5632" stroke-width="1.5" opacity="0.4"/>
  <rect x="420" y="40" width="100" height="110" rx="4" fill="none" stroke="#1a5632" stroke-width="2" opacity="0.4"/>
  <rect x="540" y="50" width="120" height="80" rx="4" fill="none" stroke="#1a5632" stroke-width="2" opacity="0.4"/>
  <rect x="555" y="60" width="80" height="60" rx="2" fill="none" stroke="#1a5632" stroke-width="1.5" opacity="0.3"/>
  <!-- Wrench center -->
  <path d="M360 200 L400 240" stroke="#e8491d" stroke-width="5" stroke-linecap="round"/>
  <circle cx="405" cy="245" r="12" fill="none" stroke="#e8491d" stroke-width="3"/>
  <!-- Arrows connecting -->
  <line x1="160" y1="160" x2="340" y2="200" stroke="#1a5632" stroke-width="1" stroke-dasharray="4 4" opacity="0.3"/>
  <line x1="260" y1="160" x2="350" y2="200" stroke="#1a5632" stroke-width="1" stroke-dasharray="4 4" opacity="0.3"/>
  <line x1="360" y1="160" x2="370" y2="200" stroke="#1a5632" stroke-width="1" stroke-dasharray="4 4" opacity="0.3"/>
  <line x1="470" y1="160" x2="390" y2="200" stroke="#1a5632" stroke-width="1" stroke-dasharray="4 4" opacity="0.3"/>
  <line x1="600" y1="140" x2="400" y2="200" stroke="#1a5632" stroke-width="1" stroke-dasharray="4 4" opacity="0.3"/>
</svg>