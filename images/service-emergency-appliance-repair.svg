<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300">
  <rect width="800" height="300" fill="#f0f4f1"/>
  <!-- Clock -->
  <circle cx="380" cy="150" r="80" fill="none" stroke="#1a5632" stroke-width="3"/>
  <circle cx="380" cy="150" r="70" fill="none" stroke="#1a5632" stroke-width="1" opacity="0.3"/>
  <line x1="380" y1="90" x2="380" y2="150" stroke="#1a5632" stroke-width="4" stroke-linecap="round"/>
  <line x1="380" y1="150" x2="420" y2="170" stroke="#e8491d" stroke-width="3" stroke-linecap="round"/>
  <circle cx="380" cy="150" r="5" fill="#1a5632"/>
  <!-- 24/7 text -->
  <text x="300" y="280" font-family="Inter,sans-serif" font-size="36" font-weight="800" fill="#1a5632" opacity="0.15">24/7</text>
  <!-- Hour marks -->
  <line x1="380" y1="75" x2="380" y2="85" stroke="#1a5632" stroke-width="2"/>
  <line x1="380" y1="215" x2="380" y2="225" stroke="#1a5632" stroke-width="2"/>
  <line x1="305" y1="150" x2="315" y2="150" stroke="#1a5632" stroke-width="2"/>
  <line x1="445" y1="150" x2="455" y2="150" stroke="#1a5632" stroke-width="2"/>
  <!-- Lightning bolt -->
  <path d="M530 80 L510 145 L535 145 L515 220" fill="none" stroke="#e8491d" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
</svg>